<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResumATE</title>
  <link rel="icon" type="image/png" href="images/2026-06-27.png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-bg-blob"></div>
    <div class="auth-card glass scale-up">
      <div class="auth-header">
        <h1 class="auth-title">Reset Password.</h1>
        <p class="auth-subtitle">Enter your email to receive reset instructions.</p>
      </div>
      
      <form id="resetForm" class="auth-form">
        <div class="form-group delay-100 slide-up">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
          <span class="error-message" id="emailError">Please enter a valid email address.</span>
        </div>
        
        <button type="submit" class="btn btn-primary auth-btn delay-200 slide-up">Send Reset Link</button>
      </form>
      
      <div class="auth-footer delay-300 slide-up">
        Remember your password? <a href="login.html" class="auth-link">Back to login</a>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.redirectIfAuth();
      
      setTimeout(() => {
        document.querySelector('.scale-up').classList.add('visible');
        document.querySelectorAll('.slide-up').forEach(el => el.classList.add('visible'));
      }, 100);

      const form = document.getElementById('resetForm');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        
        if (!emailRegex.test(email)) {
          document.getElementById('emailError').classList.add('visible');
          return;
        }
        
        document.getElementById('emailError').classList.remove('visible');
        Toast.show('If an account exists, a reset link will be sent.', 'success');
        
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 3000);
      });
    });
  </script>
</body>
</html>
